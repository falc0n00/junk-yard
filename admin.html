<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartYard — Owner Dashboard</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#101623;--muted:#6b7280;--line:#e4e8ee;
    --brand:#1257f0;--brand-d:#0b3fbb;--ok:#0e9f6e;--bad:#e02424;--warn:#c27803;
    --r:14px;--sh:0 1px 2px rgba(16,22,35,.06),0 8px 24px rgba(16,22,35,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
  .topbar .wrap{display:flex;align-items:center;gap:14px}
  .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand),#4f8bff);display:grid;place-items:center;color:#fff;font-size:12px}
  .logo span{color:var(--brand)}
  .topbar .who{margin-left:auto;font-size:13px;color:var(--muted)}
  .topbar .who b{color:var(--ink)}
  main{padding:26px 0 60px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
  h1{font-size:24px;letter-spacing:-.5px;margin:0 0 6px}
  h2{font-size:16px;margin:0 0 12px;letter-spacing:-.2px}
  .muted{color:var(--muted);font-size:13.5px}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3b4453;margin-bottom:14px}
  .field input{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;outline:none;font-size:14px;transition:.15s}
  .field input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(18,87,240,.12)}
  .btn{padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:#eef2f8;color:#38404f}
  .btn.danger{background:#fdecec;color:var(--bad)}
  .btn.ok{background:#e6f7ef;color:#0a6b48}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .center{max-width:440px;margin:60px auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .stat .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.6px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:#fbfcfe}
  tr:last-child td{border-bottom:none}
  .badge{padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.3px}
  .badge.ok{background:#e6f7ef;color:#0e9f6e}
  .badge.bad{background:#fdecec;color:#e02424}
  .badge.warn{background:#fff6e6;color:#c27803}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .stars{color:#f59e0b;letter-spacing:1px}
  .stars .off{color:#d7dce5}
  .notice{padding:13px 15px;border-radius:11px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
  .notice.info{background:#eef4ff;color:#1c3f8f}
  .notice.bad{background:#fdecec;color:#96201f}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#101623;color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;transition:.25s;opacity:0;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #toast.ok{background:#0e9f6e}#toast.bad{background:#e02424}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="logo"><span class="dot">🛡</span>Part<span>Yard</span> <span style="color:var(--muted);font-weight:500;margin-left:6px">· Owner</span></div>
    <div class="who" id="who" hidden>Signed in as <b id="who-email"></b> · <a href="#" id="logout" style="color:var(--brand);font-weight:700">Log out</a></div>
  </div>
</header>

<main class="wrap">

  <!-- ============ LOGIN ============ -->
  <div id="login-view" class="panel center" hidden>
    <h1>Owner sign in</h1>
    <p class="muted" style="margin:0 0 18px">Log in with your Supabase admin account.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Your password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="login-btn" style="width:100%;justify-content:center">Log in</button>
  </div>

  <!-- ============ DENIED ============ -->
  <div id="denied-view" class="panel center" hidden>
    <h1>Access denied</h1>
    <p class="muted">This account does not have the <b>admin</b> role.</p>
    <button class="btn ghost" id="logout-denied">Log out</button>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div id="dash-view" hidden>
    <h1>Owner dashboard</h1>
    <p class="muted" style="margin:0 0 20px">Manage every seller, listing and rating on PartYard.</p>

    <div class="stats" id="stats"></div>

    <div class="panel" style="padding:0;overflow:hidden">
      <div style="padding:18px 22px 0"><h2>Sellers</h2></div>
      <div style="overflow-x:auto">
        <table id="sellers-table">
          <thead>
            <tr>
              <th>Name</th><th>Phone</th><th>Listings</th><th>Ratings</th>
              <th>Avg</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ============ LOADING ============ -->
  <div id="loading-view" class="panel center">
    <p class="muted">Loading…</p>
  </div>

</main>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ============================================
// CONFIG — paste your values here
// ============================================
const SUPABASE_URL      = 'https://fkaklqdiwwjuhkkbksxt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-6V3AfOE1A88ezv67RZ5Pg_zsxhgJ7x';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function toast(msg, type=''){
  const t = $('#toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.className = type; }, 2600);
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function starsHTML(avg){
  const full = Math.round(avg);
  let h = '';
  for(let i=1;i<=5;i++) h += i<=full ? '★' : '<span class="off">★</span>';
  return `<span class="stars">${h}</span>`;
}

function showView(id){
  ['login-view','denied-view','dash-view','loading-view'].forEach(v => {
    const el = document.getElementById(v);
    if(el) el.hidden = v !== id;
  });
}

// ---------- auth flow ----------
async function boot(){
  showView('loading-view');

  const { data: { session } } = await supabase.auth.getSession();
  if(!session){ showView('login-view'); return; }

  const isAdmin = await checkAdmin(session.user.id);
  if(!isAdmin){ showView('denied-view'); return; }

  $('#who').hidden = false;
  $('#who-email').textContent = session.user.email;
  showView('dash-view');
  loadDashboard();
}

async function checkAdmin(userId){
  const { data, error } = await supabase
    .from('user_roles')
    .select('role')
    .eq('user_id', userId)
    .eq('role', 'admin');
  if(error) return false;
  return data && data.length > 0;
}

$('#login-btn').addEventListener('click', async () => {
  const email = $('#login-email').value.trim();
  const pass  = $('#login-pass').value;
  if(!email || !pass){ toast('Enter email and password', 'bad'); return; }

  $('#login-btn').disabled = true;
  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  $('#login-btn').disabled = false;

  if(error){ toast(error.message, 'bad'); return; }
  toast('Signed in', 'ok');
  boot();
});

$('#login-pass').addEventListener('keydown', e => { if(e.key==='Enter') $('#login-btn').click(); });

$('#logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  location.reload();
});

$('#logout-denied').addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.reload();
});

// ---------- load dashboard data via /api/admin ----------
async function loadDashboard(){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){ showView('login-view'); return; }

  const res = await fetch('/api/admin', {
    headers: { Authorization: `Bearer ${session.access_token}` },
  });

  if(res.status === 401 || res.status === 403){
    toast('Session expired. Please log in again.', 'bad');
    await supabase.auth.signOut();
    showView('login-view');
    return;
  }

  const data = await res.json();
  if(!res.ok){ toast(data.error || 'Failed to load', 'bad'); return; }

  // Stats
  const s = data.stats;
  $('#stats').innerHTML = `
    <div class="stat"><div class="k">Sellers</div><div class="v">${s.total_sellers}</div></div>
    <div class="stat"><div class="k">Listings</div><div class="v">${s.total_listings}</div></div>
    <div class="stat"><div class="k">Ratings</div><div class="v">${s.total_ratings}</div></div>
    <div class="stat"><div class="k">Suspended</div><div class="v" style="color:var(--bad)">${s.suspended_sellers}</div></div>
  `;

  // Sellers table
  const tb = document.querySelector('#sellers-table tbody');
  if(!data.sellers.length){
    tb.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">No sellers yet.</td></tr>`;
    return;
  }

  tb.innerHTML = data.sellers.map(s => {
    const avgTxt = s.ratings_count
      ? `${starsHTML(s.ratings_avg)} <span style="color:var(--muted);font-size:12px">${s.ratings_avg.toFixed(1)} (${s.ratings_count})</span>`
      : `<span style="color:var(--muted);font-size:12px">—</span>`;
    const statusBadge = s.suspended
      ? `<span class="badge bad">Suspended</span>`
      : `<span class="badge ok">Active</span>`;
    const toggleBtn = s.suspended
      ? `<button class="btn ok sm" data-action="unsuspend" data-id="${s.id}">Un-suspend</button>`
      : `<button class="btn danger sm" data-action="suspend" data-id="${s.id}">Suspend</button>`;
    return `
      <tr>
        <td><b>${esc(s.name)}</b></td>
        <td>${esc(s.phone)}</td>
        <td>${s.listings_active} active · ${s.listings_sold} sold</td>
        <td>${s.ratings_count}</td>
        <td>${avgTxt}</td>
        <td>${statusBadge}</td>
        <td>
          <div class="row-actions">
            ${toggleBtn}
            <button class="btn danger sm" data-action="delete-seller" data-id="${s.id}" data-name="${esc(s.name)}">Delete</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  // Wire up action buttons
  tb.querySelectorAll('button[data-action]').forEach(b => {
    b.addEventListener('click', () => handleAction(b.dataset.action, b.dataset.id, b.dataset.name));
  });
}

async function handleAction(action, id, name){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session) return;

  try {
    if(action === 'suspend' || action === 'unsuspend'){
      if(!confirm(`${action === 'suspend' ? 'Suspend' : 'Un-suspend'} "${name}"?`)) return;
      const res = await fetch('/api/admin', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ action, seller_id: id }),
      });
      const data = await res.json();
      if(!res.ok){ toast(data.error || 'Failed', 'bad'); return; }
      toast(action === 'suspend' ? 'Seller suspended' : 'Seller re-activated', 'ok');
      loadDashboard();
    }
    else if(action === 'delete-seller'){
      if(!confirm(`Permanently delete "${name}" and ALL their listings and ratings?\n\nThis cannot be undone.`)) return;
      const res = await fetch('/api/admin', {
        method: 'DELETE',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ type: 'seller', id }),
      });
      const data = await res.json();
      if(!res.ok){ toast(data.error || 'Failed', 'bad'); return; }
      toast('Seller deleted', 'ok');
      loadDashboard();
    }
  } catch(err){
    toast(err.message, 'bad');
  }
}

// ---------- go ----------
boot();
</script>
</body>
</html>
