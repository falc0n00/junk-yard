<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartYard — Seller account</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#101623;--muted:#6b7280;--line:#e4e8ee;
    --brand:#1257f0;--brand-d:#0b3fbb;--ok:#0e9f6e;--bad:#e02424;
    --r:14px;--sh:0 1px 2px rgba(16,22,35,.06),0 8px 24px rgba(16,22,35,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  a{color:var(--brand);font-weight:700;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 0}
  .topbar .wrap{display:flex;align-items:center;gap:14px}
  .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .logo .dot{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand),#4f8bff);display:grid;place-items:center;color:#fff;font-size:12px}
  .logo span{color:var(--brand)}
  main{padding:34px 0 60px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:26px}
  .center{max-width:460px;margin:0 auto}
  h1{font-size:24px;letter-spacing:-.5px;margin:0 0 6px;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}
  .tabs{display:flex;background:#eef2f8;border-radius:11px;padding:4px;margin-bottom:22px}
  .tabs button{flex:1;padding:10px;border-radius:8px;font-weight:700;color:var(--muted);font-size:14px;transition:.15s}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3b4453;margin-bottom:14px}
  .field input{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;outline:none;font-size:14px;transition:.15s}
  .field input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(18,87,240,.12)}
  .field .hint{font-weight:500;color:var(--muted);font-size:11.5px}
  .btn{padding:12px 18px;border-radius:10px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--brand);color:#fff;width:100%}
  .btn.primary:hover{background:var(--brand-d)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .notice{padding:13px 15px;border-radius:11px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
  .notice.info{background:#eef4ff;color:#1c3f8f}
  .notice.bad{background:#fdecec;color:#96201f}
  .notice.ok{background:#e6f7ef;color:#0a6b48}
  .divider{text-align:center;margin:18px 0 8px;font-size:13px;color:var(--muted)}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#101623;color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;transition:.25s;opacity:0;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #toast.ok{background:#0e9f6e}#toast.bad{background:#e02424}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="logo" onclick="location.href='/'">
      <span class="dot">🔧</span>Part<span>Yard</span>
    </div>
  </div>
</header>

<main class="wrap">

  <div class="panel center">

    <div class="tabs" id="tabs">
      <button data-tab="login" class="on">Log in</button>
      <button data-tab="signup">Sign up</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <h1>Welcome back</h1>
      <p class="sub">Log in to manage your listings.</p>

      <label class="field">
        Email
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
      </label>
      <label class="field">
        Password
        <input type="password" id="login-pass" placeholder="Your password" autocomplete="current-password">
      </label>
      <button class="btn primary" id="login-btn">Log in</button>

      <div class="divider">No account? <a href="#" id="go-signup">Sign up →</a></div>
    </div>

    <!-- SIGNUP -->
    <div id="signup-form" hidden>
      <h1>Create seller account</h1>
      <p class="sub">Post parts and manage them from your dashboard.</p>

      <div class="notice info">
        <span>🔐</span>
        <div>Your <b>phone number</b> is shown to buyers so they can call you. Your email is only for login.</div>
      </div>

      <label class="field">
        Name / shop name
        <input type="text" id="su-name" placeholder="e.g. Karim Auto Parts">
      </label>
      <label class="field">
        Phone number
        <input type="tel" id="su-phone" placeholder="e.g. 0611223344">
        <span class="hint">Buyers call this. Include country code if needed.</span>
      </label>
      <label class="field">
        Email
        <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email">
        <span class="hint">Used only to log in.</span>
      </label>
      <label class="field">
        Password
        <input type="password" id="su-pass" placeholder="At least 6 characters" autocomplete="new-password">
      </label>
      <label class="field">
        Confirm password
        <input type="password" id="su-pass2" placeholder="Repeat password">
      </label>

      <button class="btn primary" id="signup-btn">Create account</button>

      <div class="divider">Already have an account? <a href="#" id="go-login">Log in →</a></div>
    </div>

  </div>

</main>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ================================
// CONFIG
// ================================
const SUPABASE_URL      = 'https://fkaklqdiwwjuhkkbksxt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-6V3AfOE1A88ezv67RZ5Pg_zsxhgJ7x';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================================
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const normPhone = (p) => String(p||'').replace(/[^\d+]/g,'');

function toast(msg, type=''){
  const t = $('#toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.className = type; }, 2800);
}

// ---------- tabs ----------
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if(!b) return;
  switchTab(b.dataset.tab);
});

function switchTab(name){
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#login-form').hidden = name !== 'login';
  $('#signup-form').hidden = name !== 'signup';
  history.replaceState(null, '', name === 'signup' ? '#signup' : '#login');
}

$('#go-signup').addEventListener('click', (e)=>{ e.preventDefault(); switchTab('signup'); });
$('#go-login').addEventListener('click', (e)=>{ e.preventDefault(); switchTab('login'); });

// ---------- redirect target ----------
function nextUrl(){
  const u = new URL(location.href);
  return u.searchParams.get('next') || '/dashboard.html';
}

// ---------- already logged in? ----------
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if(session) location.href = nextUrl();
})();

// ---------- LOGIN ----------
async function doLogin(){
  const email = $('#login-email').value.trim();
  const pass  = $('#login-pass').value;
  if(!email || !pass){ toast('Enter email and password', 'bad'); return; }

  const btn = $('#login-btn');
  btn.disabled = true;
  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false;

  if(error){ toast(error.message, 'bad'); return; }
  toast('Welcome back', 'ok');
  setTimeout(() => location.href = nextUrl(), 400);
}

$('#login-btn').addEventListener('click', doLogin);
$('#login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
$('#login-email').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ---------- SIGNUP ----------
async function doSignup(){
  const name  = $('#su-name').value.trim();
  const phone = normPhone($('#su-phone').value);
  const email = $('#su-email').value.trim();
  const pass  = $('#su-pass').value;
  const pass2 = $('#su-pass2').value;

  if(!name){ toast('Enter your name or shop name', 'bad'); return; }
  if(phone.length < 6){ toast('Enter a valid phone number', 'bad'); return; }
  if(!email || !email.includes('@')){ toast('Enter a valid email', 'bad'); return; }
  if(pass.length < 6){ toast('Password must be at least 6 characters', 'bad'); return; }
  if(pass !== pass2){ toast('Passwords do not match', 'bad'); return; }

  const btn = $('#signup-btn');
  btn.disabled = true;

  // 1) Check phone isn't already taken
  const { data: existing } = await supabase
    .from('sellers')
    .select('id')
    .eq('phone', phone)
    .maybeSingle();

  if(existing){
    btn.disabled = false;
    toast('That phone number is already registered. Log in instead.', 'bad');
    return;
  }

  // 2) Create the auth user
  const { data: authData, error: authErr } = await supabase.auth.signUp({
    email, password: pass,
  });

  if(authErr){
    btn.disabled = false;
    toast(authErr.message, 'bad');
    return;
  }
  if(!authData.user){
    btn.disabled = false;
    toast('Signup failed — no user returned', 'bad');
    return;
  }

    // 3) Make sure we have a live session before inserting into sellers
  if (!authData.session) {
    const { error: signInErr } = await supabase.auth.signInWithPassword({
      email, password: pass,
    });
    if (signInErr) {
      btn.disabled = false;
      toast('Signup ok but login failed: ' + signInErr.message, 'bad');
      return;
    }
  }

  // 4) Insert the seller profile (now authenticated)
  const { error: insErr } = await supabase.from('sellers').insert({
    user_id: authData.user.id,
    name, phone,
  });

  if(insErr){
    btn.disabled = false;
    toast('Profile error: ' + insErr.message, 'bad');
    return;
  }

  btn.disabled = false;
  toast('Account created! Redirecting…', 'ok');
  setTimeout(() => location.href = nextUrl(), 600);
}

$('#signup-btn').addEventListener('click', doSignup);
$('#su-pass2').addEventListener('keydown', e => { if(e.key==='Enter') doSignup(); });

// ---------- open signup tab if URL is #signup ----------
if(location.hash === '#signup') switchTab('signup');
</script>
</body>
</html>
